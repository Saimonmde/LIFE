# LIFE INC · El Jardín. Postgres (psycopg) sólo si DATABASE_URL está definida.
services:
  - type: web
    name: lifein
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python3 tools/update_licensing.py --build-source-only
    startCommand: python3 server.py --host 0.0.0.0
    healthCheckPath: /healthz
