# Respaldo de Saimon City en cada fusión importante a main.
# El repositorio es público: la base va cifrada o a un almacén privado.
name: Respaldo de Saimon City

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linea_base:
        description: 'Marcar esta instantánea como línea base'
        type: boolean
        default: false
      solo_datos:
        description: 'Adjuntar la base a la etiqueta que ya existe en este commit'
        type: boolean
        default: false
      resumen:
        description: 'Resumen en español, si quieres escribirlo a mano'
        required: false
        type: string
      etiqueta:
        description: 'Etiqueta ya creada, sólo si adjuntas datos a una antigua'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: respaldo-main
  cancel-in-progress: false

jobs:
  respaldo:
    if: github.repository == 'Saimonmde/LIFE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Publicar el respaldo
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GAME_CLOCK_EPOCH: ${{ secrets.GAME_CLOCK_EPOCH }}
          SIMON_DATA_KEY: ${{ secrets.SIMON_DATA_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          LINEA_BASE: ${{ github.event.inputs.linea_base }}
          SOLO_DATOS: ${{ github.event.inputs.solo_datos }}
          RESUMEN_MANUAL: ${{ github.event.inputs.resumen }}
          ETIQUETA: ${{ github.event.inputs.etiqueta }}
        run: pip install -r requirements.txt boto3 && python3 tools/respaldos.py publicar
